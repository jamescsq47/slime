name: pd
channels:
  - defaults
dependencies:
  - python=3.12
  - gxx_linux-64
  - pip
  - pip:
      # Newer releases require CUDA 13 and a >=580 driver. 0.5.10.post1 is
      # the newest SGLang release compatible with this host's 570/CUDA 12.x
      # driver and installs PyTorch 2.9.1 with CUDA 12.8 wheels.
      - sglang==0.5.10.post1
      - sglang-router==0.3.2
      - aiohttp
      - blobfile
      - httpx
      - matplotlib
      - nixl==1.3.2
      - omegaconf
      - pandas
      - pylatexenc
      - pytest
      - ray[default]
