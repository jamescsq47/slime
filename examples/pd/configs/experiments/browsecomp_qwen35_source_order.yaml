schema_version: 1

datasets:
  - id: qa
    harness: browsecomp
    path: ${PD_DATA_ROOT}/browsecomp/bc_train.jsonl
    weight: 1
    options:
      # Model-specific loop/prompt.  Qwen3 configurations do not load it.
      agent_profile: data/browsecomp/prompts/qwen35_react.yaml
      max_response_tokens: 36864
      max_tokens_per_turn: 2048
      max_turns: 100
      search_url: http://127.0.0.1:8750
      # Bound each returned observation as a second guard. Qwen3.5 searches
      # much more often than Qwen3, so the original 10 x 512-word observation
      # can consume the 40k context before the agent can finish.
      # The generic/Qwen3 configuration intentionally leaves these unset.
      search_total_topk_per_turn: 5
      search_snippet_words: 256
      open_page_words: 2048
      search_count_revisits_as_full: true

sampling:
  policy: fixed
  seed: 2026
  preserve_source_order: true
  shuffle_algorithm: source_order
  count_algorithm: largest_remainder_v1
  pool_reuse_algorithm: cycle_as_needed_v1
  schedule_file: ../workloads/fixed_browsecomp_source_order_n680.json
