schema_version: 1
name: browsecomp-qwen3-8b-tp1-4p4d
description: >-
  Reproducible formal profile for pure BrowseComp on the custom bidirectional
  KV pipeline. Native SGLang HiCache/Mooncake remains disabled by new_method.

# These are defaults, not hidden constants. A value explicitly exported by the
# caller overrides the profile and is shown as such in the startup summary.
environment:
  WORKLOAD_CONFIG: ../experiments/browsecomp_source_order.yaml
  MODEL_PATH: /dataset/model/qwen3/Qwen3-8B
  PD_DATA_ROOT: /homes/siqic/data

  PREFILL_GPUS: "0 2 4 6"
  PREFILL_PORTS: "27300 27320 27400 27420"
  BOOTSTRAP_PORTS: "28300 28320 28400 28420"
  DECODE_GPUS: "1 3 5 7"
  DECODE_PORTS: "27301 27321 27401 27421"
  DECODE_MEM_FRACTION_STATICS: "0.85 0.85 0.85 0.74"
  SEARCH_GPU: 7
  SEARCH_PORT: 8750

  REQUESTS: 680
  WARMUP_REQUESTS: 0
  MAX_INFLIGHT: 512
  SEED: 2026
  TEMPERATURE: 0
  TOP_P: 1
  TOP_K: -1
  MAX_CONTEXT_LENGTH: 40960
  MAX_RESPONSE_LENGTH: 36864
  WARMUP_SECONDS: 300
  MAX_WARMUP_SECONDS: 420
  MEASURE_SECONDS: 1200
  CLOSED_LOOP: 1

  # Agentic KV data-plane settings under test.
  D_TARGET_KV_FRACTION: 1.0
  FAST_TOOL_THRESHOLD_SECONDS: 2
  DIRECT_WAIT_SECONDS: 2
  D2P_HOST_ARENA_GIB_PER_P: 128
  P2D_HOST_ARENA_GIB_PER_P: 32
  P2D_HOST_STAGING: true
  P_TO_D_CONSUMERS: 24
  MAX_PREFILL_INFLIGHT: 12
  PD_INFERENCE_RETURN_LOGPROB: false
